[project]
name = "sam2-updated"
version = "0.2.0"
description = "SAM2 point-prompt video labeling web app (Gradio in FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "fastapi",
    "uvicorn",
    "gradio>=6.0",
    "numpy",
    "opencv-python-headless",
    "pycocotools",
    "imageio-ffmpeg",
]

[project.scripts]
sam2-updated = "sam2_updated.app:main"        # -> uv run sam2-updated

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

# CUDA 12.8 torch on Linux (cluster), normal PyPI build on Windows/macOS.
# cu128 (not cu124) so the same env also runs on the Blackwell RTX B6000 nodes (gpu-node-bw);
# it works on the H200 / MIG nodes too.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# SAM2's optional CUDA extension often fails to build and isn't needed.
[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "0" }

# Build sam-2 against the same torch as the app (no second ~1 GB torch download for the build).
[tool.uv.extra-build-dependencies]
sam-2 = [{ requirement = "torch", match-runtime = true }]
