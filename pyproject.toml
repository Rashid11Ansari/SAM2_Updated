[project]
name = "sam2-labeling"
version = "0.1.0"
description = "SAM2 point-prompt video labeling web app (Gradio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "numpy",
    "matplotlib",
    "opencv-python-headless",
    "gradio>=6.0",
    "pycocotools",
    "imageio-ffmpeg",
]

[tool.uv]
package = false

[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "0" }
